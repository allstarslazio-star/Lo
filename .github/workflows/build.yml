name: Build and test NerdFM

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Keep the Gradle build log
        if: always()
        run: echo "Authoritative command was 'gradle testDebugUnitTest assembleDebug'; see the step log and the uploaded reports."
      - name: Add test summary to job summary
        if: always()
        shell: bash
        run: |
          echo '## NerdFM unit-test results' >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/*.xml)
          if (( ${#files[@]} == 0 )); then
            echo 'No JUnit XML reports were generated.' >> "$GITHUB_STEP_SUMMARY"
          else
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print('| Tests | Failures | Errors | Skipped |')
          print('|---:|---:|---:|---:|')
          print('| {tests} | {failures} | {errors} | {skipped} |'.format(**totals))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NerdFM-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NerdFM-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
