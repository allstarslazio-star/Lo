name: Long-season soak

# Heavy, seeded headless careers (M8). Not part of every pull request: run it nightly and before a release.
# A green run of this workflow is the ONLY evidence that a 30-season soak passed.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons per career'
        default: '30'
      careers:
        description: 'Independent seeded careers'
        default: '3'

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      NERDFM_SOAK_SEASONS: ${{ github.event.inputs.seasons || '30' }}
      NERDFM_SOAK_CAREERS: ${{ github.event.inputs.careers || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run the soak, determinism and save-matrix tests
        run: >
          gradle testDebugUnitTest --no-daemon --stacktrace
          --tests '*LongSeasonSoakTest*' --tests '*SaveMigrationMatrixTest*' --tests '*WorldIntegrityExtendedTest*'
      - name: Summarise
        if: always()
        shell: bash
        run: |
          echo "## NerdFM soak (${NERDFM_SOAK_CAREERS} careers x ${NERDFM_SOAK_SEASONS} seasons)" >> "$GITHUB_STEP_SUMMARY"
          shopt -s nullglob
          for f in app/build/test-results/testDebugUnitTest/*LongSeasonSoakTest*.xml; do
            grep -h "soak seed=" "$f" | sed 's/&#10;/\n/g' >> "$GITHUB_STEP_SUMMARY" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NerdFM-soak-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
